# /etc/slurm/plugstack.conf.d/ebpf.conf
#
# SPANK plugin for ebpf_exporter
#
# Two modes, uncomment one of them:
#
# always mode: every job enables the exporter (nothing required from users)
# required /usr/lib64/slurm/spank_ebpf.so mode=always
#
# opt-in mode: only jobs with --ebpf enable it
optional /usr/lib64/slurm/spank_ebpf.so mode=opt-in

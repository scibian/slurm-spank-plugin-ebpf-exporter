# /etc/slurm/plugstack.conf.d/ebpf.conf
#
# Plugin SPANK pour ebpf_exporter
#
# Deux modes, décommenter l'un des deux :
#
# Mode always : tout job active l'exporter (rien à faire côté utilisateur)
required /usr/lib64/slurm/spank_ebpf.so mode=always
#
# Mode opt-in : seuls les jobs avec --ebpf l'activent
# optional /usr/lib64/slurm/spank_ebpf.so mode=opt-in
